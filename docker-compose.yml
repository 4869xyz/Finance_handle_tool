version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: invoice_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invoice_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: invoice_backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoice_backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/invoice_db
      DEBUG: "true"
    volumes:
      - ./backend:/app
      - paddleocr_models:/root/.paddleocr
    ports:
      - "18080:18080"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "18080"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:18080/api/health',timeout=3)); assert data.get('status') == 'ok' and data.get('database') == 'healthy'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ocr_worker:
    image: invoice_backend:local
    container_name: invoice_ocr_worker
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/invoice_db
      DEBUG: "true"
    volumes:
      - ./backend:/app
      - paddleocr_models:/root/.paddleocr
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.ocr_worker"]
    restart: unless-stopped
    stop_grace_period: 2m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invoice_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "15173:15173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:18080

volumes:
  postgres_data:
  paddleocr_models:
